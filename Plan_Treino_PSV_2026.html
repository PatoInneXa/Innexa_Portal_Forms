<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<title>Plan Treino PSV 2026</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; background: #f5f5f0; color: #1a1a1a; }
:root {
  --accent: #1D9E75; --accent-light: #E1F5EE; --accent-dark: #085041;
  --accent2: #5B3FD4; --accent2-light: #EDE9FB; --accent2-dark: #2D1A8C;
  --accent3: #D4703F; --accent3-light: #FBEBE2; --accent3-dark: #8C3D1A;
  --warn: #BA7517; --warn-light: #FAEEDA;
  --surface: #ffffff; --surface2: #f5f5f0;
  --border: rgba(0,0,0,0.12); --text: #1a1a1a;
  --muted: #666; --hint: #999;
}
@media (prefers-color-scheme: dark) {
  body { background: #1a1a1a; color: #f0f0f0; }
  :root {
    --surface: #2a2a2a; --surface2: #222;
    --border: rgba(255,255,255,0.12); --text: #f0f0f0;
    --muted: #aaa; --hint: #777;
    --accent-light: #0a3d2a; --accent-dark: #5DCAA5;
    --accent2-light: #1e1540; --accent2-dark: #a48ff5;
    --accent3-light: #3d2414; --accent3-dark: #e8a378;
  }
}
.app { max-width: 390px; margin: 0 auto; padding: 12px; padding-bottom: 40px; }
.header { padding: 14px 0 12px; border-bottom: 0.5px solid var(--border); margin-bottom: 14px; }
.header h1 { font-size: 18px; font-weight: 600; color: var(--text); }
.stats-row { display: flex; gap: 10px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
.stat-group { display: flex; align-items: center; gap: 5px; }
.stat-label { font-size: 12px; color: var(--muted); }
.stat-input { width: 58px; padding: 4px 7px; border-radius: 8px; border: 0.5px solid var(--border); background: var(--surface2); color: var(--text); font-size: 14px; font-weight: 600; text-align: center; -webkit-appearance: none; }
.stat-unit { font-size: 12px; color: var(--hint); }

/* MODE SWITCHER */
.mode-switcher { display: flex; gap: 0; margin-bottom: 14px; border-radius: 12px; overflow: hidden; border: 0.5px solid var(--border); background: var(--surface2); padding: 2px; }
.mode-btn { flex: 1; padding: 10px 6px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; background: transparent; color: var(--muted); text-align: center; -webkit-tap-highlight-color: transparent; border-radius: 10px; }
.mode-btn.active-gym { background: var(--accent); color: #fff; }
.mode-btn.active-cali { background: var(--accent2); color: #fff; }

/* SUB-TAB SWITCHER (Calistenia vs Ciclismo) */
.subtab-switcher { display: flex; gap: 6px; margin-bottom: 14px; }
.subtab-btn { flex: 1; padding: 9px 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; border-radius: 10px; border: 0.5px solid var(--border); background: var(--surface); color: var(--muted); text-align: center; -webkit-tap-highlight-color: transparent; }
.subtab-btn.active-cali { background: var(--accent2); color: #fff; border-color: var(--accent2); }
.subtab-btn.active-bike { background: var(--accent3); color: #fff; border-color: var(--accent3); }

.week-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.week-tabs::-webkit-scrollbar { display: none; }
.week-tab { flex-shrink: 0; padding: 7px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer; border: 0.5px solid var(--border); background: var(--surface2); color: var(--muted); -webkit-tap-highlight-color: transparent; }
.week-tab.active-gym  { background: var(--accent);  color: #fff; border-color: var(--accent); }
.week-tab.active-cali { background: var(--accent2); color: #fff; border-color: var(--accent2); }

.day-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.day-tabs::-webkit-scrollbar { display: none; }
.day-tab { flex-shrink: 0; padding: 8px 10px; border-radius: 10px; font-size: 11px; font-weight: 500; cursor: pointer; border: 0.5px solid var(--border); background: var(--surface); color: var(--muted); text-align: center; min-width: 76px; -webkit-tap-highlight-color: transparent; }
.day-tab.active-gym  { background: var(--accent-light);  color: var(--accent-dark);  border-color: var(--accent); }
.day-tab.active-cali { background: var(--accent2-light); color: var(--accent2-dark); border-color: var(--accent2); }
.day-tab.active-bike { background: var(--accent3-light); color: var(--accent3-dark); border-color: var(--accent3); }

.section-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.section-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; display: flex; align-items: center; gap: 7px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.dot-green { background: var(--accent); }
.dot-purple { background: var(--accent2); }
.dot-orange { background: var(--accent3); }
.dot-amber { background: var(--warn); }
.dot-blue { background: #378ADD; }
select { width: 100%; padding: 9px 10px; border-radius: 10px; border: 0.5px solid var(--border); background: var(--surface2); color: var(--text); font-size: 13px; -webkit-appearance: none; appearance: none; }
.exercise-list { display: flex; flex-direction: column; gap: 10px; }
.ex-row { display: flex; flex-direction: column; gap: 5px; padding: 11px; background: var(--surface2); border-radius: 10px; border: 0.5px solid var(--border); }
.ex-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.ex-name { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; line-height: 1.4; }
.ex-badge      { font-size: 11px; color: var(--accent-dark);  background: var(--accent-light);  padding: 2px 9px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; }
.ex-badge-cali { font-size: 11px; color: var(--accent2-dark); background: var(--accent2-light); padding: 2px 9px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; }
.ex-badge-corp { font-size: 11px; color: #185FA5; background: #E6F1FB; padding: 2px 9px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; }
.ex-meta { font-size: 11px; color: var(--muted); }
.ex-note { font-size: 11.5px; color: var(--text); background: var(--surface); border-radius: 8px; padding: 7px 9px; margin-top: 2px; line-height: 1.5; border-left: 2.5px solid var(--accent2); }
.ex-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 3px; }
.ex-weight-row { display: flex; align-items: center; gap: 6px; }
.ex-weight-label { font-size: 11px; color: var(--muted); }
.weight-input { width: 66px; padding: 5px 8px; border-radius: 8px; border: 0.5px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; font-weight: 600; text-align: center; -webkit-appearance: none; }
.weight-unit { font-size: 11px; color: var(--hint); }
.btn-img { display: flex; align-items: center; gap: 4px; padding: 6px 11px; border-radius: 8px; border: 0.5px solid var(--border); background: var(--surface); color: var(--muted); font-size: 12px; cursor: pointer; flex-shrink: 0; text-decoration: none; -webkit-tap-highlight-color: transparent; }
.btn-img svg { width: 13px; height: 13px; }
.btn-done-gym  { width: 100%; margin-top: 14px; padding: 14px; background: var(--accent);  color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.btn-done-cali { width: 100%; margin-top: 14px; padding: 14px; background: var(--accent2); color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.btn-done-bike { width: 100%; margin-top: 14px; padding: 14px; background: var(--accent3); color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.completed-banner { background: var(--accent-light); border: 0.5px solid var(--accent); border-radius: 10px; padding: 11px 14px; font-size: 13px; color: var(--accent-dark); display: none; text-align: center; margin-top: 10px; font-weight: 600; }
.cali-info-card { background: var(--accent2-light); border: 0.5px solid var(--accent2); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; font-size: 12px; color: var(--accent2-dark); line-height: 1.6; }
.cali-info-card strong { font-weight: 700; }

/* Phase selector */
.phase-select-wrap { margin-bottom: 12px; }
.phase-select-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; display: block; }

/* Objective banner */
.objective-card { background: var(--surface2); border: 0.5px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 12px; color: var(--text); line-height: 1.5; }
.objective-card strong { color: var(--accent2-dark); }

/* Bike session card */
.bike-hero { background: linear-gradient(135deg, var(--accent3-light), var(--surface2)); border: 0.5px solid var(--accent3); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.bike-hero-title { font-size: 15px; font-weight: 700; color: var(--accent3-dark); margin-bottom: 4px; }
.bike-hero-sub { font-size: 12px; color: var(--muted); }
.bike-stats-row { display: flex; gap: 8px; margin-top: 10px; }
.bike-stat { flex: 1; background: var(--surface); border-radius: 8px; padding: 8px; text-align: center; border: 0.5px solid var(--border); }
.bike-stat-val { font-size: 15px; font-weight: 700; color: var(--accent3-dark); }
.bike-stat-label { font-size: 10px; color: var(--muted); margin-top: 1px; }

.bike-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.bike-table th { text-align: left; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; padding: 6px 8px; border-bottom: 1px solid var(--border); }
.bike-table td { padding: 9px 8px; border-bottom: 0.5px solid var(--border); vertical-align: top; }
.bike-table tr:last-child td { border-bottom: none; }
.bike-block-name { font-weight: 600; color: var(--text); }
.rpe-badge { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 8px; white-space: nowrap; }
.rpe-low { background: #E1F5EE; color: #085041; }
.rpe-mid { background: #FAEEDA; color: #BA7517; }
.rpe-high { background: #FBE2E2; color: #A52424; }
@media (prefers-color-scheme: dark) {
  .rpe-low { background: #0a3d2a; color: #5DCAA5; }
  .rpe-mid { background: #3d2e0a; color: #e8c05a; }
  .rpe-high { background: #3d1414; color: #e88a8a; }
}

.progression-list { display: flex; flex-direction: column; gap: 8px; }
.progression-item { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; line-height: 1.5; }
.progression-item .bullet { width: 5px; height: 5px; border-radius: 50%; background: var(--accent3); margin-top: 6px; flex-shrink: 0; }

.precaution-card { background: var(--warn-light); border: 0.5px solid var(--warn); border-radius: 10px; padding: 11px 13px; font-size: 12px; color: var(--warn); line-height: 1.6; margin-bottom: 12px; }
@media (prefers-color-scheme: dark) { .precaution-card { background: #3d2e0a; color: #e8c05a; } }

.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 100; align-items: flex-end; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal-sheet { background: var(--surface); border-radius: 20px 20px 0 0; width: 100%; max-width: 390px; padding: 0 0 40px; max-height: 88vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.modal-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 12px auto 0; }
.modal-header { padding: 14px 16px 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 0.5px solid var(--border); }
.modal-title { font-size: 15px; font-weight: 600; color: var(--text); flex: 1; padding-right: 8px; line-height: 1.3; }
.modal-close { background: var(--surface2); border: none; font-size: 18px; cursor: pointer; color: var(--muted); line-height: 1; padding: 6px 10px; border-radius: 50%; }
.modal-body { padding: 16px; }
.modal-ex-meta { font-size: 13px; color: var(--text); background: var(--surface2); border-radius: 10px; padding: 10px 12px; line-height: 1.8; }
.modal-ex-meta span { color: var(--muted); font-size: 12px; }
.modal-btn-yt { display: block; width: 100%; margin-top: 12px; padding: 12px; border-radius: 10px; border: 0.5px solid var(--border); background: var(--surface2); color: var(--accent); font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>Plan Treino PSV 2026</h1>
    <div class="stats-row">
      <div class="stat-group">
        <span class="stat-label">Peso:</span>
        <input class="stat-input" type="number" id="pesoActual" value="104" min="30" max="250" step="0.5"/>
        <span class="stat-unit">kg</span>
      </div>
      <div class="stat-group">
        <span class="stat-label">Estatura:</span>
        <input class="stat-input" type="number" id="estaturaActual" value="1.80" min="1.0" max="2.5" step="0.01" style="width:62px;"/>
        <span class="stat-unit">m</span>
      </div>
    </div>
  </div>

  <!-- MODE SWITCHER -->
  <div class="mode-switcher">
    <button class="mode-btn active-gym" id="btnGym" onclick="setMode('gym')">🏋️ Gimnasio</button>
    <button class="mode-btn" id="btnCali" onclick="setMode('cali')">🌳 Calistenia</button>
  </div>

  <!-- SUB-TAB: solo visible en modo cali -->
  <div class="subtab-switcher" id="subtabSwitcher" style="display:none;">
    <button class="subtab-btn active-cali" id="btnSubCali" onclick="setSubTab('cali')">💪 Calistenia</button>
    <button class="subtab-btn" id="btnSubBike" onclick="setSubTab('bike')">🚴 Ciclismo</button>
  </div>

  <!-- ══════════ VISTA: GYM + CALISTENIA (ejercicios) ══════════ -->
  <div id="exerciseView">
    <div class="week-tabs" id="weekTabs"></div>
    <div class="day-tabs" id="dayTabs"></div>

    <!-- Fase de progresión (solo calistenia) -->
    <div class="phase-select-wrap" id="phaseWrap" style="display:none;">
      <span class="phase-select-label">Fase de progresión</span>
      <select id="phaseSelect" onchange="onPhaseChange(this.value)"></select>
    </div>

    <!-- Objetivo del día (solo calistenia) -->
    <div class="objective-card" id="objectiveCard" style="display:none;"></div>

    <!-- Cali info banner: cuerda + caminata -->
    <div class="cali-info-card" id="caliInfoCard" style="display:none;">
      <strong id="ropeInfo"></strong>
    </div>

    <div class="section-card" id="warmupSection">
      <div class="section-title"><span class="dot dot-amber"></span>Calentamiento</div>
      <div id="warmupBlock"></div>
    </div>

    <div class="section-card">
      <div class="section-title" id="exSectionTitle">
        <span class="dot dot-green" id="exDot"></span>Bloque de fuerza
      </div>
      <div class="exercise-list" id="exerciseList"></div>
    </div>

    <div class="section-card" id="finisherSection" style="display:none;">
      <div class="section-title"><span class="dot dot-purple"></span><span id="finisherTitle">Finisher</span></div>
      <div id="finisherBlock" class="ex-note" style="margin-top:0;"></div>
    </div>

    <div class="section-card" id="cardioSection">
      <div class="section-title"><span class="dot dot-blue"></span><span id="cardioSectionTitle">Cardio post rutina</span></div>
      <select id="cardioSelect"></select>
    </div>

    <div id="doneBtnWrap"></div>
    <div class="completed-banner" id="doneBanner">¡Rutina completada! Excelente trabajo 💪</div>
  </div>

  <!-- ══════════ VISTA: CICLISMO ══════════ -->
  <div id="bikeView" style="display:none;">
    <div class="day-tabs" id="bikeDayTabs"></div>
    <div id="bikeContent"></div>
    <button class="btn-done-bike" onclick="markDone()">Marcar salida completada</button>
    <div class="completed-banner" id="bikeDoneBanner">¡Salida completada! Buen trabajo sobre la bici 🚴</div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <span class="modal-title" id="modalTitle"></span>
      <button class="modal-close" onclick="closeModalDirect()">×</button>
    </div>
    <div class="modal-body">
      <div class="modal-ex-meta" id="modalMeta"></div>
      <a class="modal-btn-yt" id="modalSearchLink" target="_blank">Buscar video en YouTube ↗</a>
    </div>
  </div>
</div>

<script>

function getYtQuery(name) {
  return "https://www.youtube.com/results?search_query=" + encodeURIComponent("como hacer " + name + " ejercicio");
}
function isCorporal(p) {
  if (typeof p !== 'string') return false;
  const l = p.toLowerCase();
  return l === 'corporal' || l.includes('corporal') || l.includes('asistido');

  document.getElementById('subtabSwitcher').style.display = m === 'cali' ? 'flex' : 'none';

  if (m === 'cali') {
    subTab = 'cali';
    updateSubtabButtons();
    document.getElementById('exSectionTitle').innerHTML = '<span class="dot dot-purple" id="exDot"></span>Bloque de fuerza';
  } else {
    document.getElementById('exerciseView').style.display = 'block';
    document.getElementById('bikeView').style.display = 'none';
    document.getElementById('exSectionTitle').innerHTML = '<span class="dot dot-green" id="exDot"></span>Ejercicios';
  }
  renderAll();
}

function setSubTab(t) {
  subTab = t;
  updateSubtabButtons();
  if (t === 'cali') {
    document.getElementById('exerciseView').style.display = 'block';
    document.getElementById('bikeView').style.display = 'none';
    renderAll();
  } else {
    document.getElementById('exerciseView').style.display = 'none';
    document.getElementById('bikeView').style.display = 'block';
    renderBikeDayTabs();
    renderBikeContent();
  }
}
function updateSubtabButtons() {
  document.getElementById('btnSubCali').className = 'subtab-btn' + (subTab==='cali' ? ' active-cali' : '');
  document.getElementById('btnSubBike').className = 'subtab-btn' + (subTab==='bike' ? ' active-bike' : '');
}

/* ═══════════════════════ RENDER: GYM + CALISTENIA ═══════════════════════ */
function renderAll() {
  if (mode === 'gym') {
    renderGymWeekTabs();
    renderGymDayTabs();
    document.getElementById('phaseWrap').style.display = 'none';
    document.getElementById('objectiveCard').style.display = 'none';
    document.getElementById('caliInfoCard').style.display = 'none';
    document.getElementById('finisherSection').style.display = 'none';
    document.getElementById('cardioSectionTitle').textContent = 'Cardio post rutina';
    renderGymWarmup();
    renderGymExercises();
    renderGymCardio();
  } else {
    document.getElementById('weekTabs').innerHTML = '';
    renderCaliDayTabs();
    renderPhaseSelect();
    renderCaliDay();
  }
  renderDoneBtn();
}

/* ── GYM ── */
function renderGymWeekTabs() {
  document.getElementById('weekTabs').innerHTML = gymWeeks.map((w,i) =>
    `<div class="week-tab ${i===currentWeek ? 'active-gym' : ''}" onclick="selectGymWeek(${i})">${w.name}</div>`).join('');
}
function renderGymDayTabs() {
  document.getElementById('dayTabs').innerHTML = gymWeeks[currentWeek].days.map((d,i) =>
    `<div class="day-tab ${i===currentDay ? 'active-gym' : ''}" onclick="selectGymDay(${i})">
      <div>${d.label}</div>
      <div style="font-size:10px;color:var(--muted);margin-top:2px;">${d.name}</div>
    </div>`).join('');
}
function renderGymWarmup() {
  document.getElementById('warmupBlock').innerHTML =
    `<select id="warmupSelect">${warmupOptionsGym.map(o => `<option>${o.name} — ${o.detail}</option>`).join('')}</select>`;
}
function renderGymCardio() {
  document.getElementById('cardioSelect').innerHTML = cardioOptionsGym.map(o =>
    `<option>${o.name} — ${o.detail}</option>`).join('');
}
function renderGymExercises() {
  const day = gymWeeks[currentWeek].days[currentDay];
  document.getElementById('exerciseList').innerHTML = day.exercises.map((ex, i) => {
    const key = weightKey('gym', currentWeek, currentDay, i);
    const corp = isCorporal(ex.peso);
    const storedW = userWeights[key] !== undefined ? userWeights[key] : (corp ? '' : ex.peso);
    const badge = corp
      ? `<span class="ex-badge-corp">Corporal</span>`
      : `<span class="ex-badge">${ex.series} series</span>`;
    const weightRow = corp ? '' : `
      <div class="ex-weight-row">
        <span class="ex-weight-label">Peso:</span>
        <input class="weight-input" type="number" step="0.5" min="0" value="${storedW}" placeholder="kg"
          oninput="saveWeight('gym',${currentWeek},${currentDay},${i},this.value)"/>
        <span class="weight-unit">kg</span>
      </div>`;
    return `<div class="ex-row">
      <div class="ex-header">
        <span class="ex-name">${ex.name}</span>
        ${badge}
      </div>
      <div class="ex-meta">${ex.reps}${corp ? ' · ' + ex.series + ' series' : ''}</div>
      <div class="ex-bottom">
        ${weightRow}
        <a class="btn-img" href="${getYtQuery(ex.name)}" target="_blank">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 2l10 6-10 6V2z"/></svg>
          Video
        </a>
      </div>
    </div>`;
  }).join('');
  document.getElementById('doneBanner').style.display = 'none';
}
function selectGymWeek(i) { currentWeek=i; currentDay=0; renderGymWeekTabs(); renderGymDayTabs(); renderGymExercises(); }
function selectGymDay(i) { currentDay=i; renderGymDayTabs(); renderGymExercises(); }

/* ── CALISTENIA ── */
function renderCaliDayTabs() {
  document.getElementById('dayTabs').innerHTML = caliDays.map((d,i) =>
    `<div class="day-tab ${i===currentDay ? 'active-cali' : ''}" onclick="selectCaliDay(${i})">
      <div>${d.label}</div>
      <div style="font-size:10px;color:var(--muted);margin-top:2px;">Sesión ${d.code}</div>
    </div>`).join('');
}
function renderPhaseSelect() {
  document.getElementById('phaseWrap').style.display = 'block';
  document.getElementById('phaseSelect').innerHTML = phases.map(p =>
    `<option value="${p.id}" ${p.id===currentPhase?'selected':''}>${p.label}</option>`).join('');
}
function onPhaseChange(id) { currentPhase = parseInt(id); renderCaliDay(); }

function renderCaliDay() {
  const day = caliDays[currentDay];
  const phase = phases[currentPhase];

  // Objective
  document.getElementById('objectiveCard').style.display = 'block';
  document.getElementById('objectiveCard').innerHTML = `<strong>Objetivo:</strong> ${day.objective}`;

  // Rope + phase notes banner
  document.getElementById('caliInfoCard').style.display = 'block';
  const ropeTime = phase.ropeMin === phase.ropeMax ? `${phase.ropeMin} min` : `${phase.ropeMin}–${phase.ropeMax} min`;
  document.getElementById('caliInfoCard').innerHTML = `
    <strong>📋 ${phase.label}</strong><br>
    ${phase.notes.map(n => `• ${n}`).join('<br>')}
  `;

  // Warmup
  document.getElementById('warmupBlock').innerHTML = `
    <div class="ex-meta" style="margin-bottom:8px;font-weight:600;">${day.warmupDuration}</div>
    ${day.warmup.map(w => `<div class="ex-note" style="margin-bottom:6px;">${w}</div>`).join('')}
  `;

  // Rest note above exercises
  document.getElementById('exSectionTitle').innerHTML = '<span class="dot dot-purple"></span>Bloque de fuerza';

  // Exercises
  document.getElementById('exerciseList').innerHTML =
    `<div class="ex-meta" style="margin-bottom:2px;">${day.restNote}</div>` +
    day.exercises.map((ex, i) => {
      const key = weightKey('cali', currentPhase, currentDay, i);
      return `<div class="ex-row">
        <div class="ex-header">
          <span class="ex-name">${ex.name}</span>
          <span class="ex-badge-cali">${ex.series} series</span>
        </div>
        <div class="ex-meta">${ex.reps}</div>
        <div class="ex-note">${ex.note}</div>
        <div class="ex-bottom">
          <span></span>
          <a class="btn-img" href="${getYtQuery(ex.name)}" target="_blank">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 2l10 6-10 6V2z"/></svg>
            Video
          </a>
        </div>
      </div>`;
    }).join('');

  // Finisher
  document.getElementById('finisherSection').style.display = 'block';
  document.getElementById('finisherTitle').textContent = `${day.finisherTitle} — ${day.finisherDuration}`;
  document.getElementById('finisherBlock').textContent = day.finisher;

  // Cardio/rope section
  document.getElementById('cardioSectionTitle').textContent = `Cuerda — ${ropeTime}`;
  document.getElementById('cardioSection').querySelector('#cardioSelect').outerHTML =
    `<div class="ex-note" id="cardioSelect" style="margin-top:0;">${day.ropeNote}</div>`;

  document.getElementById('doneBanner').style.display = 'none';
}
function selectCaliDay(i) { currentDay=i; renderCaliDayTabs(); renderCaliDay(); }

function renderDoneBtn() {
  const cls = mode === 'gym' ? 'btn-done-gym' : 'btn-done-cali';
  document.getElementById('doneBtnWrap').innerHTML =
    `<button class="${cls}" onclick="markDone()">Marcar rutina completada</button>`;
}

/* ═══════════════════════ RENDER: CICLISMO ═══════════════════════ */
function renderBikeDayTabs() {
  document.getElementById('bikeDayTabs').innerHTML = bikeDays.map((d,i) =>
    `<div class="day-tab ${i===currentBikeDay ? 'active-bike' : ''}" onclick="selectBikeDay(${i})">
      <div>${d.icon} ${d.label}</div>
      <div style="font-size:10px;color:var(--muted);margin-top:2px;">${d.code}</div>
    </div>`).join('');
}
function rpeClass(level) { return level === 'high' ? 'rpe-high' : level === 'mid' ? 'rpe-mid' : 'rpe-low'; }

function renderBikeContent() {
  const d = bikeDays[currentBikeDay];
  document.getElementById('bikeContent').innerHTML = `
    <div class="bike-hero">
      <div class="bike-hero-title">${d.icon} ${d.name}</div>
      <div class="bike-hero-sub">${d.intro}</div>
      <div class="bike-stats-row">
        <div class="bike-stat">
          <div class="bike-stat-val">${d.distance}</div>
          <div class="bike-stat-label">Distancia</div>
        </div>
        <div class="bike-stat">
          <div class="bike-stat-val">${d.label}</div>
          <div class="bike-stat-label">Día</div>
        </div>
      </div>
    </div>

    <div class="section-card">
      <div class="section-title"><span class="dot dot-orange"></span>Estructura de la sesión</div>
      <table class="bike-table">
        <thead><tr><th>Bloque</th><th>Trabajo</th><th>Intensidad</th></tr></thead>
        <tbody>
          ${d.blocks.map(b => `
            <tr>
              <td class="bike-block-name">${b.name}</td>
              <td>${b.work}</td>
              <td><span class="rpe-badge ${rpeClass(b.level)}">${b.rpe}</span></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      <div class="ex-note" style="margin-top:10px;">${d.rpeInfo}</div>
    </div>

    <div class="section-card">
      <div class="section-title"><span class="dot dot-orange"></span>Progresión mensual</div>
      <div class="progression-list">
        ${d.progression.map(p => `<div class="progression-item"><span class="bullet"></span><span>${p}</span></div>`).join('')}
      </div>
    </div>

    <div class="ex-note" style="margin-bottom:12px;">${d.footer}</div>
  `;
  document.getElementById('bikeDoneBanner').style.display = 'none';
}
function selectBikeDay(i) { currentBikeDay=i; renderBikeDayTabs(); renderBikeContent(); }

/* ═══════════════════════ SHARED ACTIONS ═══════════════════════ */
function saveWeight(m,w,d,e,val) { userWeights[weightKey(m,w,d,e)] = val; }
function markDone() {
  const id = (mode === 'cali' && subTab === 'bike') ? 'bikeDoneBanner' : 'doneBanner';
  const b = document.getElementById(id);
  b.style.display = 'block';
  setTimeout(() => { b.style.display = 'none'; }, 3000);
}
function openModal(name, reps, series) {
  document.getElementById('modalTitle').textContent = name;
  document.getElementById('modalMeta').innerHTML =
    `<span>Repeticiones:</span> ${reps}<br><span>Series:</span> ${series}`;
  document.getElementById('modalSearchLink').href = getYtQuery(name);
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

// Init
renderAll();
</script>
</body>
</html>
